system:
  # 鈿欙笍 System Settings
  # Controls performance and behavior of core system threads.
  fps_limit_main: 30                # 馃殽 Main loop FPS 鈥?controls recognition and monitor refresh
  fps_limit_keyboard_controller: 30 # 馃殽 Keyboard controller thread FPS
  fps_limit_window_capturor: 30     # 馃殽 Window capture thread FPS
  fps_limit_route_visualization: 4
  fps_limit_debug_ui: 8
  debug_ui_scale: 0.85  # Monitor preview scale; higher = sharper (trade FPS)
  fps_limit_route_recorder: 10      # 馃殽 Route recorder FPS
  fps_limit_auto_dice_roller: 1     # 馃殽 Auto rice roller FPS
  key_debounce_interval: 1          # 鈴憋笍 Cooldown (in seconds) between function key presses (e.g., F1, F2...)
  server: "TW"                      # 鈿欙笍 Options: "TW" "NA"
  language: "cn"                    # 鈿欙笍 Options: "eng" "cn"


shutdown_monitor:
  # Timed / lost-character auto-shutdown (UI tab "定时关机")
  # timed: at local HH:MM run `shutdown /s /t <shutdown_delay_sec>`
  # lost: if player missing continuously for lost_seconds while bot runs
  # Unchecking runs `shutdown /a` to abort a pending countdown
  timed_enable: false
  timed_at: "03:00"
  lost_enable: false
  lost_seconds: 60
  shutdown_delay_sec: 60

profiler:
